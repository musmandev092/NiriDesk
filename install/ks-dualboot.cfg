%include /tmp/niridesk/ks-packages.cfg
%end

%post --nochroot --interpreter=/usr/bin/bash --log=/mnt/sysroot/root/ks-post-nochroot.log
set -x
S=/mnt/sysroot
T=/tmp/niridesk
install -m 600 "$T/choices.env" "$S/root/niridesk-choices.env"
install -m 600 "$T/niridesk-config.json" "$S/root/niridesk-config.json"
[ -s "$T/console-font.psfu" ] && install -D -m 644 "$T/console-font.psfu" "$S/usr/lib/kbd/consolefonts/niridesk.psfu"
. "$T/choices.env"
if [ "$NETCOPY" = 1 ]; then
    for f in /etc/NetworkManager/system-connections/*.nmconnection; do
        [ -f "$f" ] && install -m 600 "$f" "$S/etc/NetworkManager/system-connections/"
    done
fi
u=$ADMIN
src=""
for m in /run/install/repo /run/install/sources/* /run/install/isodir /run/niridesk-iso; do
    [ -d "$m/NiriDesk" ] && { src="$m/NiriDesk"; break; }
done
if [ -z "$src" ]; then
    dev=$(blkid -L Fedora-E-dvd-x86_64-45 2>/dev/null || true)
    mkdir -p /mnt/msiso
    [ -n "$dev" ] && mount -o ro "$dev" /mnt/msiso && [ -d /mnt/msiso/NiriDesk ] && src=/mnt/msiso/NiriDesk
fi
if [ -n "$src" ]; then
    mkdir -p "$S/home/$u/Projects" && cp -a "$src" "$S/home/$u/Projects/NiriDesk"
    # Media built on another filesystem can carry world-writable modes.
    chmod -R go-w "$S/home/$u/Projects/NiriDesk"
    echo "NiriDesk copied from $src"
else
    echo "WARNING: NiriDesk not found on the install media"
fi
mountpoint -q /mnt/msiso && umount /mnt/msiso
for f in "$S/root/anaconda-ks.cfg" "$S/root/original-ks.cfg"; do
    [ -f "$f" ] && sed -i '/--passphrase/d' "$f"
done
rm -f "$T/ks-machine.cfg"
%end

%post --interpreter=/usr/bin/bash --log=/root/ks-post.log
set -x
. /root/niridesk-choices.env

cat > /etc/yum.repos.d/brave-browser.repo <<'EOF'
[brave-browser]
name=Brave Browser
baseurl=https://brave-browser-rpm-release.s3.brave.com/$basearch
enabled=1
gpgcheck=1
gpgkey=https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
EOF

for c in dms dux-repo; do
cat > "/etc/yum.repos.d/_copr:copr.fedorainfracloud.org:duxlabs:$c.repo" <<EOF
[copr:copr.fedorainfracloud.org:duxlabs:$c]
name=Copr repo for $c owned by duxlabs
baseurl=https://download.copr.fedorainfracloud.org/results/duxlabs/$c/fedora-\$releasever-\$basearch/
type=rpm-md
gpgcheck=1
gpgkey=https://download.copr.fedorainfracloud.org/results/duxlabs/$c/pubkey.gpg
repo_gpgcheck=0
enabled=1
enabled_metadata=1
EOF
done

rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-rpmfusion-*-fedora-45 || true
for k in https://brave-browser-rpm-release.s3.brave.com/brave-core.asc \
         https://download.copr.fedorainfracloud.org/results/duxlabs/dms/pubkey.gpg \
         https://download.copr.fedorainfracloud.org/results/duxlabs/dux-repo/pubkey.gpg \
         https://musmandev092.github.io/claude-desktop-rpm/RPM-GPG-KEY-claude-desktop-rpm.asc; do
    rpm --import "$k" || echo "WARNING: could not import $k"
done

DMS_OWN="quickshell,dux-search,dux-gop,matugen"
mkdir -p /etc/dnf/repos.override.d
cat > /etc/dnf/repos.override.d/50-dms-copr.repo <<EOF
[fedora]
excludepkgs=$DMS_OWN
[updates]
excludepkgs=$DMS_OWN
[updates-testing]
excludepkgs=$DMS_OWN
EOF
[ "$TESTING" = 1 ] && printf '[updates-testing]\nenabled=1\n' > /etc/dnf/repos.override.d/60-niridesk-testing.repo
own=""; for p in ${DMS_OWN//,/ }; do rpm -q "$p" >/dev/null 2>&1 && own="$own $p"; done
[ -n "$own" ] && dnf -y --setopt=allow_vendor_change=True --setopt=install_weak_deps=False upgrade $own

dnf -y --setopt=install_weak_deps=False upgrade --refresh
if [ -n "$EXTRA_PKGS" ]; then
    dnf -y --setopt=install_weak_deps=False install $EXTRA_PKGS || echo "WARNING: could not install: $EXTRA_PKGS"
fi

dms-greeter enable --yes || true
if ! grep -q -- "dms-greeter --command niri" /etc/greetd/config.toml 2>/dev/null; then
    printf '[terminal]\nvt = 1\n\n[default_session]\ncommand = "/usr/bin/dms-greeter --command niri"\nuser = "greeter"\n' > /etc/greetd/config.toml
fi
systemctl enable greetd.service
systemctl set-default graphical.target

sed -i '/^GRUB_DISABLE_OS_PROBER=/d' /etc/default/grub
if [ "$OS_PROBER" = 1 ]; then echo 'GRUB_DISABLE_OS_PROBER=false'; else echo 'GRUB_DISABLE_OS_PROBER=true'; fi >> /etc/default/grub
grub2-mkconfig -o /boot/grub2/grub.cfg
grep -i -m1 "menuentry 'Windows" /boot/grub2/grub.cfg || echo "note: no Windows found by os-prober"

mkdir -p /boot/grub2/fonts
grub2-mkfont -s 48 -o /boot/grub2/fonts/adwaita-mono-48.pf2 \
  /usr/share/fonts/adwaita-mono-fonts/AdwaitaMono-Regular.ttf || true

# keyboard layout (niri reads it via localed)
mkdir -p /etc/X11/xorg.conf.d
{
    echo 'Section "InputClass"'
    echo '    Identifier "system-keyboard"'
    echo '    MatchIsKeyboard "on"'
    echo "    Option \"XkbLayout\" \"$XKB_LAYOUT\""
    [ -n "$XKB_VARIANT" ] && echo "    Option \"XkbVariant\" \"$XKB_VARIANT\""
    [ -n "$XKB_OPTIONS" ] && echo "    Option \"XkbOptions\" \"$XKB_OPTIONS\""
    echo 'EndSection'
} > /etc/X11/xorg.conf.d/00-keyboard.conf
printf '[zram0]\nzram-size = min(ram, 8192)\ncompression-algorithm = zstd\nswap-priority = 100\n' > /etc/systemd/zram-generator.conf

u=$ADMIN
M=/home/$u/Projects/NiriDesk
if [ -n "$u" ] && [ -x "$M/apply.sh" ]; then
    if [ "${TOOLBOX:-0}" = 1 ]; then touch "$M/.toolbox"; else rm -f "$M/.toolbox"; fi
    rm -f "$M/.extras"; for x in ${EXTRAS:-}; do echo "$x" >> "$M/.extras"; done
    chown -R "$u:$u" "/home/$u/Projects"
    NIRIDESK_NVIDIA="${NVIDIA:-auto}" "$M/apply.sh" system
    runuser -u "$u" -- env HOME="/home/$u" USER="$u" bash "$M/apply.sh" home || echo "WARNING: apply.sh home failed; firstrun retries it"
    unit=/home/$u/.config/systemd/user
    mkdir -p "$unit/default.target.wants"
    install -m 0644 "$M/install/niridesk-firstrun.service" "$unit/"
    ln -sf ../niridesk-firstrun.service "$unit/default.target.wants/niridesk-firstrun.service"
    dv=$(rpm -q --qf '%{VERSION}' dms | grep -oE '^[0-9]+\.[0-9]+') || dv=""
    [ -n "$dv" ] && mkdir -p "/home/$u/.config/dms" && echo "$dv" > "/home/$u/.config/dms/.changelog-$dv"
    chown -R "$u:$u" "/home/$u/.config"
else
    echo "WARNING: no NiriDesk for '$u': run apply.sh by hand after first login"
fi

H=/home/$ADMIN/Projects/NiriDesk/install/hibernate
if [ "$HIBERNATE" = 1 ] && [ -d "$H" ]; then
    install -d /usr/local/libexec/niridesk-hibernate
    install -m 0755 "$H/niridesk-hibernate-setup" "$H/niridesk-resume-check" /usr/local/libexec/niridesk-hibernate/
    install -m 0644 "$H"/niridesk-resume-check*.service "$H"/niridesk-resume-check.timer /usr/local/libexec/niridesk-hibernate/
    install -m 0644 "$H/niridesk-hibernate-setup.service" /etc/systemd/system/
    systemctl enable niridesk-hibernate-setup.service
fi

if [ -s /usr/lib/kbd/consolefonts/niridesk.psfu ]; then
    sed -i '/^FONT=/d' /etc/vconsole.conf 2>/dev/null; echo 'FONT=niridesk' >> /etc/vconsole.conf
fi

# fix labels of files copied from the media
restorecon -RF "/home/$ADMIN" /usr/local /etc/greetd /etc/udev/rules.d /etc/systemd/system 2>/dev/null || true

echo "NiriDesk install finished: $(date -Is)" > /root/ks-done
%end
