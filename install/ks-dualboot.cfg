text
firstboot --disable
selinux --enforcing
firewall --enabled

%include /tmp/niridesk/ks-machine.cfg

%pre --interpreter=/usr/bin/bash --erroronfail --log=/tmp/ks-pre.log
for d in /usr/share/niridesk-setup /run/install/repo/NiriDesk/install/tui; do
    [ -f "$d/niridesk-setup" ] && exec bash "$d/niridesk-setup" --preset=dualboot
done
dev=$(blkid -L Fedora-E-dvd-x86_64-45 2>/dev/null)
mkdir -p /run/niridesk-iso
[ -n "$dev" ] && mount -o ro "$dev" /run/niridesk-iso && exec bash /run/niridesk-iso/NiriDesk/install/tui/niridesk-setup --preset=dualboot
echo "niridesk-setup not found on the install media"
exit 1
%end

